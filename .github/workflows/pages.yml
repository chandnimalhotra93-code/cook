name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Rebuild original banner image
        shell: bash
        run: |
          cat assets/banner.part0 assets/banner.part1 assets/banner.part2 > /tmp/banner.b64
          base64 --decode /tmp/banner.b64 > assets/banner.jpg
          file assets/banner.jpg
          rm -f assets/banner.part0 assets/banner.part1 assets/banner.part2

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
